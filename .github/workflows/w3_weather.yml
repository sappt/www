name: W3 Weather Update (전국10개도시)

on:
  # 2026-08-07: schedule 비활성화. 로컬 크론(run_update.sh → w3.py)이 매시 정각에
  # w3.html 을 생성·푸시하도록 이관했다. 두 writer 가 같은 master 에 push 하면서
  # 최근 100회 중 15회가 push 스텝에서 실패했기 때문(writer 단일화).
  # 이 워크플로는 로컬 크론 장애 시 쓰는 수동 백업으로만 남긴다.
  # 다시 켜려면 아래 두 줄의 주석을 풀고 로컬 w3.py 호출을 먼저 제거할 것.
  # schedule:
  #   - cron: '0 * * * *'
  workflow_dispatch: # 수동 실행 버튼

permissions:
  contents: write

# 동일 워크플로 중복 실행 방지 (진행 중인 실행은 끝까지 보장)
concurrency:
  group: w3-weather
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          # shallow(depth 1)면 rebase 병합기준을 못 찾음 – 재시도용 여유분 확보
          fetch-depth: 50

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: 라이브러리 설치
        run: pip install requests

      - name: w3.html 생성
        run: python build_w3.py

      - name: 결과 커밋 및 푸시
        run: |
          git config --global user.name 'WeatherBot'
          git config --global user.email 'bot@noreply.github.com'
          git add w3.html
          git commit -m "Update w3 weather: $(date)" || exit 0

          # 로컬 cron(5분 주기)이 같은 브랜치에 push 하므로 거부는 상시 발생.
          # w3.html은 이 워크플로 전용 파일이라 rebase 내용 충돌은 나지 않음.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push 성공 (시도 $i)"
              exit 0
            fi
            echo "push 거부 – rebase 후 재시도 ($i/5)"
            git fetch origin master
            if ! git rebase origin/master; then
              git rebase --abort || true
              echo "::error::rebase 충돌 – 중단"
              exit 1
            fi
            sleep $(( (RANDOM % 10) + 3 ))
          done
          echo "::error::5회 재시도 후에도 push 실패"
          exit 1
