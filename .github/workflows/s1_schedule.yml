name: 매시간일정업데이트(주간계획표)

on:
  #schedule:
    # 매시 정각(0분)마다 실행 '0 * * * *'
    # 30분마다 실행 '*/30 * * * *'
    # 10분마다 실행 '*/10 * * * *'
    #- cron: '*/10 * * * *' 
  workflow_dispatch: # 수동 실행 버튼 추가

permissions:
  contents: write

# 동일 워크플로 중복 실행 방지 (진행 중인 실행은 끝까지 보장)
concurrency:
  group: s1-schedule
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4 # v3에서 v4로 업데이트
        with:
          # shallow(depth 1)면 rebase 병합기준을 못 찾음 – 재시도용 여유분 확보
          fetch-depth: 50

      - name: 파이썬 설정
        uses: actions/setup-python@v5 # v4에서 v5로 업데이트
        with:
          python-version: '3.9'

      - name: 라이브러리 설치
        run: pip install requests

      - name: 주간 일정 HTML 생성
        run: python build_s1.py

      - name: 결과 커밋 및 푸시
        run: |
          git config --global user.name 'ScheduleBot'
          git config --global user.email 'bot@noreply.github.com'
          git add s1.html
          git commit -m "Update s1.html" || exit 0

          # 주의: s1.html은 로컬 cron(s1.py)도 쓰는 유일한 이중 소유 파일이라
          # 다른 워크플로와 달리 rebase 내용 충돌이 실제로 날 수 있다.
          # 충돌 시 중단하고 수동 확인 (생성기 일원화 전까지의 임시 방어).
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push 성공 (시도 $i)"
              exit 0
            fi
            echo "push 거부 – rebase 후 재시도 ($i/5)"
            git fetch origin master
            if ! git rebase origin/master; then
              git rebase --abort || true
              echo "::error::rebase 충돌 – s1.html 이중 생성기 문제. 수동 확인 필요"
              exit 1
            fi
            sleep $(( (RANDOM % 10) + 3 ))
          done
          echo "::error::5회 재시도 후에도 push 실패"
          exit 1
